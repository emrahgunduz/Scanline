# Builds Scanline.app, checks it, and publishes a GitHub Release with the zipped app, its
# SHA-256 and the dSYM.
#
# Runs on its own after a successful CI run on main (Actions -> CI -> Run workflow, branch main),
# releasing the commit CI tested. CI runs on other branches, or failed ones, release nothing.
# It can also be started by hand: Actions -> Release -> Run workflow.
#
# Version: 1.0.<run number>, where the run number counts this workflow's runs (skipped runs
# count too, so numbers can jump). The release and its tag (v1.0.<n>) are created on that commit.
name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    # After CI only when it passed (a failed or cancelled CI run releases nothing).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VERSION: 1.0.${{ github.run_number }}
      TAG: v1.0.${{ github.run_number }}
      # The commit to build: the one CI tested, or the chosen branch's commit when started by hand.
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build, zip and check the app
        run: APP_VERSION="$VERSION" APP_BUILD="${{ github.run_number }}" scripts/build_release.sh --clean

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/Release
          # Asset names without spaces; the checksum file names the zip exactly as published,
          # so `shasum -a 256 -c` works after downloading.
          ZIP="Scanline-${VERSION}.zip"
          DSYM="Scanline-${VERSION}.dSYM.zip"
          mv Scanline.zip "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          ditto -c -k --keepParent Scanline.app.dSYM "$DSYM"
          cat > notes.md <<NOTES
          **Scanline ${TAG}** for Apple Silicon Macs (macOS 26 or later) and the IRIScan Express 4.

          1. Download \`${ZIP}\` and unzip it. To check it: \`shasum -a 256 -c ${ZIP}.sha256\`
          2. The app isn't notarized, so macOS blocks it the first time. Run once:
             \`xattr -dr com.apple.quarantine Scanline.app\`
             or allow it in System Settings: see [Installing](https://github.com/${{ github.repository }}#installing) in the README.
          3. Move Scanline.app to Applications and open it, then click **Install Helper…** once (asks for your password).

          SHA-256: \`$(cut -d' ' -f1 "$ZIP.sha256")\`
          NOTES
          gh release create "$TAG" --target "$COMMIT" --title "Scanline ${TAG}" --notes-file notes.md \
            "$ZIP" "$ZIP.sha256" "$DSYM"
